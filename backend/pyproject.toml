[project]
name = "pf-platform"
version = "0.1.0"
description = "Privacy-first personal finance platform (IN/US equity focus)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "cryptography>=42",
    "argon2-cffi>=23.1",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
postgres = ["psycopg2-binary>=2.9"]
mcp = ["mcp>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = { find = { include = ["app*"] } }
